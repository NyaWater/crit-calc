<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Critical Damage Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Critical Damage Calculator</h1>

    <label>Base Damage</label>
    <input type="number" id="baseDmg">

    <label>Critical Rate (e.g., 80 means 80%)</label>
    <input type="number" id="critRate">

    <label>Critical Resistance (e.g., 80 means 80%)</label>
    <input type="number" id="critRes">

    <label>Critical Damage Bonus</label>
    <input type="number" id="critDmgBonus">

    <label>Calculating Mode</label>
    <select id="mode">
        <option value="add">Additive (e.g., 150 means +150%)</option>
        <option value="multiply">Multiplier (e.g., 150 means x150%)</option>
    </select>

    <button id="calc-btn">Start Calculating</button>

    <div id="result">Result displays here</div>

    <script src="app.js"></script>
</body>
</html>
